<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f3;
            color: #1c1d19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            text-align: center;
            padding: 2.5rem 3rem;
        }
        h1 {
            font-size: 3rem;
            margin: 0 0 0.5rem;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0 0 1.5rem;
            color: #55564f;
            font-size: 1.05rem;
        }
        a {
            color: #3e5771;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Not found</h1>
        <p>The page you're looking for doesn't exist or has moved.</p>
        <a href="/">Go back home</a>
    </div>
</body>
</html>
